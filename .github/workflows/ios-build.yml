name: iOS build

on:
  push:
    branches: ["claude/**"]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Game logic tests
        run: |
          swiftc -swift-version 5 MiniGameHub/Logic/*.swift MiniGameHub/Data/*.swift MiniGameHub/Models/*.swift Tests/LogicTests/main.swift -o "$RUNNER_TEMP/logic-tests"
          "$RUNNER_TEMP/logic-tests"

      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project MiniGameHub.xcodeproj \
            -target MiniGameHub \
            -sdk iphonesimulator \
            -configuration Debug \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$RUNNER_TEMP/build" \
            build 2>&1 | grep -E "error|warning: unre|BUILD|\*\*" | head -200

      # A zipped simulator build, for trying the app in a browser-based
      # iPhone simulator when no Mac is to hand. Download it from the
      # "Artifacts" section of the workflow run page.
      - name: Package the simulator build
        run: |
          cd "$RUNNER_TEMP/build/Debug-iphonesimulator"
          lipo -archs MiniGameHub.app/MiniGameHub
          zip -r -y -q "$RUNNER_TEMP/MiniGameHub-simulator.zip" MiniGameHub.app
          ls -lh "$RUNNER_TEMP/MiniGameHub-simulator.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: MiniGameHub-simulator-build
          path: ${{ runner.temp }}/MiniGameHub-simulator.zip
          retention-days: 30
